/* grid position of expert e in the opening tableau */
function home(e){ const col=e%8, row=(e-col)/8;
  return [CX-3.5*66+col*66, 250+row*66]; }

/* S1 — 32 experts, four of them lit */
function s1(p){
  const app=sg(p,0,.3);
  for(let e=0;e<NE;e++){
    const [x,y]=home(e), a=sg(p,e*.006,e*.006+.25);
    dot(x,y,10,K.faint,a);
  }
  const lit=[];
  for(let e=0;e<NE;e++) if(EX.bad.tokens[e][0]>0) lit.push(e);
  const sel=sg(p,.34,.52);
  lit.forEach((e,i)=>{ const [x,y]=home(e);
    const a=sg(p,.34+i*.03,.34+i*.03+.18);
    dot(x,y,lp(10,17,ei(a)),K.hot,a); });
  writeOn("32 位专家",CX,150,sg(p,.08,.28),{size:38,w:600,ls:2});
  writeOn("每个控制步，路由器只选 4 位",CX,560,sg(p,.55,.78),{size:26,col:K.dim});
  if(sel>.9) txt("Top-4",CX,610,{size:20,col:K.hot,a:sg(p,.8,.95)});
}

/* S2 — the column becomes a ribbon: same 32 rows, time unrolls to the right */
function s2(p){
  const morph=ei(sg(p,.08,.62));
  const X0=200, X1=1080, RH=11;
  const yTop=180;
  for(let e=0;e<NE;e++){
    const [hx,hy]=home(e);
    const y=lp(hy,yTop+e*RH,morph);
    const x=lp(hx,X0,morph);
    dot(x,y,lp(10,3.2,morph),K.faint,1);
  }
  const grown=sg(p,.5,.95);
  if(grown>0){
    const cur=Math.round(ei(grown)*T);
    RUNS.bad.forEach(r=>{
      if(r.s>cur)return;
      const y=yTop+r.e*RH+1.6;
      const x1=X0+r.s/T*(X1-X0), x2=X0+Math.min(r.t,cur)/T*(X1-X0);
      stroke([[x1,y],[Math.max(x2,x1+1),y]],K.bad,3,.75*morph);
    });
  }
  writeOn("让它跑 36 步",CX,110,sg(p,.12,.34),{size:34,w:600,ls:1});
  writeOn("每一横道是一位专家，被选中时点亮",CX,640,sg(p,.62,.85),{size:21,col:K.dim});
}

/* S3 — two trajectories; the stasis one grows unbroken runs */
function s3(p){
  const X0=210,X1=1070,RH=8.4;
  const rows=[{k:"ok", y:150, c:K.ok,  lab:"成功"},
              {k:"bad",y:390, c:K.bad, lab:"停滞陷入"}];
  const cur=Math.round(ei(sg(p,.05,.55))*T);
  const hot=sg(p,.55,.78);
  rows.forEach(r=>{
    writeOn(r.lab,X0-24,r.y+14,sg(p,.02,.18),{size:22,col:r.c,al:"right",w:600});
    RUNS[r.k].forEach(q=>{
      if(q.s>cur)return;
      const y=r.y+q.e*RH+2, sticky=q.len>=4;
      const x1=X0+q.s/T*(X1-X0), x2=X0+Math.min(q.t,cur)/T*(X1-X0);
      const col = sticky? (r.k==="bad"? lpCol(r.c,K.hot,hot) : r.c) : r.c;
      stroke([[x1,y],[Math.max(x2,x1+1),y]],col,sticky?4.2:2.4,
             sticky?.95:.4, sticky&&r.k==="bad"?10*hot:0);
    });
  });
  if(hot>.35)
    writeOn("有几位专家，再也没被换掉",CX,652,sg(p,.6,.82),{size:26,col:K.hot});
  const big=sg(p,.82,1);
  if(big>0){
    txt("AUC",CX-108,610,{size:22,col:K.dim,a:big});
    txt(N.occ_auc.toFixed(2),CX-6,616,{size:56,col:K.hot,a:big,w:600,al:"left"});
  }
}
function lpCol(a,b,t){
  const p=x=>[parseInt(x.slice(1,3),16),parseInt(x.slice(3,5),16),parseInt(x.slice(5,7),16)];
  const A=p(a),B=p(b);
  return `rgb(${A.map((v,i)=>Math.round(lp(v,B[i],t)).toString()).join(",")})`;
}

/* S4 — the reversal: input persistence rises in lockstep */
function s4(p){
  const X0=230,X1=1050,Y0=520,Y1=200;
  const Xp=t=>X0+t/T*(X1-X0), Yp=v=>lp(Y0,Y1,cl(v,-.15,1.05));
  txt("等一下",CX,110,{size:40,w:600,a:sg(p,.02,.16),col:K.hot});
  stroke([[X0,Y0],[X1,Y0]],K.faint,1,sg(p,.1,.22));
  const drawA=ei(sg(p,.14,.44)), drawB=ei(sg(p,.46,.74));
  const build=(arr,upto)=>{const o=[];for(let t=0;t<=T;t++){
    if(arr[t]==null)continue; if(t/T>upto)break; o.push([Xp(t),Yp(arr[t])]);} return o;};
  stroke(build(GAP.occ,drawA),K.hot,3.4,1,8);
  if(drawA>.95) txt("路由粘滞",Xp(T)+12,Yp(GAP.occ[T]),{size:19,col:K.hot,al:"left",a:sg(p,.4,.5)});
  stroke(build(GAP.inp,drawB),K.ok,3.4,1,8);
  if(drawB>.9) txt("路由器输入自己不动了",Xp(T)+12,Yp(GAP.inp[T])+26,
    {size:19,col:K.ok,al:"left",a:sg(p,.7,.8)});
  writeOn("两条差值曲线各自归一化后，同步抬起",CX,606,sg(p,.62,.82),{size:22,col:K.dim});
  const rev=sg(p,.8,.96);
  if(rev>0){
    txt("跨 rollout 相关   r = "+N.corr,CX,652,{size:24,col:K.ink,a:rev,w:600});
    txt("把输入回归掉之后， AUC "+N.occ_auc.toFixed(2)+" → "+N.residual_auc.toFixed(2),
        CX,690,{size:22,col:K.bad,a:sg(p,.88,1)});
  }
}

/* S5/S6 — the second finding and its collapse */
function bars(items,p,title,sub,note){
  const BX=CX-330,BW=660,Y0=250,BH=46,GAP2=76;
  writeOn(title,CX,120,sg(p,.04,.24),{size:32,w:600,ls:1});
  const mx=.95, base=.80;
  items.forEach((it,i)=>{
    const y=Y0+i*GAP2, a=sg(p,.16+i*.1,.16+i*.1+.22);
    const v=typeof it.v==="function"? it.v(p) : it.v;
    const w=(v-base)/(mx-base)*BW;
    bar(BX,y,w*ei(a),BH,it.c,.9);
    txt(it.lab,BX-18,y+31,{size:20,col:K.dim,al:"right",a});
    txt(v.toFixed(3),BX+w*ei(a)+14,y+31,{size:22,col:K.ink,al:"left",a,w:600});
  });
  if(sub) writeOn(sub,CX,Y0+items.length*GAP2+56,sg(p,.55,.75),{size:24,col:K.dim});
  if(note) txt(note[0],CX,Y0+items.length*GAP2+112,
    {size:40,col:note[1],a:sg(p,.72,.9),w:600});
}
function s5(p){
  bars([{lab:"模拟器真值",v:N.sim_raw[0],c:K.dim},
        {lab:"＋ MoE",   v:N.sim_raw[1],c:K.ok}],
       p,"那换个问法：MoE 知道物理状态不知道的事吗？",
       "同一批 rollout，同一套折，只换喂进去的特征",
       ["+"+N.sim_raw[2].toFixed(3),K.ok]);
}
function s6(p){
  const grow=ei(sg(p,.28,.62));
  bars([{lab:"模拟器真值 ＋ 相对几何",v:()=>lp(N.sim_raw[0],N.sim_rich[0],grow),c:K.hot},
        {lab:"＋ MoE",              v:N.sim_rich[1],c:K.ok}],
       p,"又等一下：线性读出器算不出「夹爪到壶多远」",
       "把 17 个相对几何量直接喂给对照组",
       ["+"+N.sim_rich[2].toFixed(3),K.bad]);
  if(grow>.8) writeOn("增量没了",CX,660,sg(p,.76,.92),{size:26,col:K.bad,w:600});
}

/* S7 — what survives */
function s7(p){
  bars([{lab:"非特权（本体感受＋指令）",v:N.runtime[0],c:K.dim},
        {lab:"＋ 针对性「原地打转」特征",v:N.runtime[0]+N.runtime_attack,c:K.hot},
        {lab:"＋ MoE",                  v:N.runtime[1],c:K.ok}],
       p,"策略本来就拿不到物体位姿",
       "同样的攻击方式，这次只贡献 +"+N.runtime_attack.toFixed(3),
       ["+"+N.runtime[2].toFixed(3),K.ok]);
}

/* S8 — the boundary */
function s8(p){
  const X0=240,X1=1040,Y=330;
  const Xp=t=>X0+t/40*(X1-X0);
  stroke([[X0,Y],[X1,Y]],K.faint,2,sg(p,.04,.2));
  writeOn("但它在陷入之后才出现",CX,140,sg(p,.02,.22),{size:34,w:600,ls:1});
  const marks=[[N.onset_median,"陷入起点中位",K.bad],[N.onset_p90,"九成已陷入",K.bad],
               [34,"合并窗口末端",K.ok]];
  marks.forEach((m,i)=>{
    const a=sg(p,.24+i*.14,.24+i*.14+.2), x=Xp(m[0]);
    stroke([[x,Y-26],[x,Y+26]],m[2],3,a);
    txt("t"+m[0],x,Y+54,{size:20,col:m[2],a,w:600});
    // t30 and t34 sit close together; lift the middle label clear of its neighbour
    txt(m[1],x,Y+(i===1?-76:-46),{size:17,col:K.dim,a});
  });
  writeOn("是「卡住了」的读数，不是预警",CX,480,sg(p,.66,.86),{size:26,col:K.dim});
  // 单点检验只有 13 个簇，功效很低；合并 t20-t34 才是有效的读法
  txt("+0.043　t20–t34 合并",CX,566,{size:30,col:K.ok,a:sg(p,.8,.95),w:600});
  txt("p=0.012 · 单个时刻各自功效不足 · 陷入之前为 0",CX,614,
      {size:19,col:K.gone,a:sg(p,.86,1)});
}

const FN=[s1,s2,s3,s4,s5,s6,s7,s8];

/* ---------- driver ---------- */
let clock=0,playing=false,last=0;
function frame(){
  g.fillStyle=K.bg; g.fillRect(0,0,W,H);
  let i=0; for(let k=0;k<SC.length;k++) if(clock>=AT[k]) i=k;
  const p=cl((clock-AT[i])/SC[i].d,0,1);
  const fade = Math.min(sg(p,0,.06), 1-sg(p,.94,1));
  g.save(); g.globalAlpha=i===0&&p<.06?1:cl(fade*8+.2,0,1);
  FN[i](p); g.restore();
  document.getElementById("s").value=Math.round(clock/DUR*1000);
  document.getElementById("t").textContent=clock.toFixed(1)+" / "+DUR.toFixed(0)+"s";
  document.querySelectorAll("#ch button").forEach((b,k)=>b.classList.toggle("on",k===i));
}
function loop(ts){
  if(playing){ if(last) clock=Math.min(DUR,clock+(ts-last)/1000); last=ts;
    if(clock>=DUR){playing=false;document.getElementById("p").textContent="▶";}
    frame(); } else last=0;
  requestAnimationFrame(loop);
}
document.getElementById("p").addEventListener("click",e=>{
  playing=!playing; if(clock>=DUR)clock=0; last=0; e.target.textContent=playing?"❚❚":"▶";});
document.getElementById("s").addEventListener("input",e=>{
  playing=false; document.getElementById("p").textContent="▶";
  clock=e.target.value/1000*DUR; frame();});
document.getElementById("ch").innerHTML=SC.map((s,i)=>
  `<button data-i="${i}">${i+1} ${s.n}</button>`).join("");
document.querySelectorAll("#ch button").forEach(b=>b.addEventListener("click",()=>{
  playing=false; document.getElementById("p").textContent="▶";
  clock=AT[+b.dataset.i]+.02; frame();}));
clock=1.6; frame(); requestAnimationFrame(loop);
</script>
