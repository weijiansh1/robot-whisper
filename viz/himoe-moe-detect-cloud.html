const W=1280,H=720;
const K={bg:"#0a0a0a",ink:"#fff",dim:"#8a8a8a",faint:"#2e2e2e",
         ok:"#58C4DD",trap:"#FC6255",hot:"#F0DC5A"};
const F='system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC","PingFang SC",sans-serif';
const g=document.getElementById("c").getContext("2d");
g.scale(2,2);

const cl=(v,a,b)=>Math.max(a,Math.min(b,v)), lp=(a,b,t)=>a+(b-a)*t;
const ei=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const sg=(t,a,b)=>cl((t-a)/(b-a),0,1);
function tx(s,x,y,{size=22,col=K.ink,al="center",w=400,a=1,ls=0}={}){
  if(a<=0)return; g.save(); g.globalAlpha=a; g.fillStyle=col; g.textAlign=al;
  g.font=`${w} ${size}px ${F}`; g.letterSpacing=ls+"px"; g.fillText(s,x,y);
  g.letterSpacing="0px"; g.restore();
}
function ln(x1,y1,x2,y2,col,lw=1,a=1){
  if(a<=0)return; g.save(); g.globalAlpha=a; g.strokeStyle=col; g.lineWidth=lw;
  g.lineCap="round"; g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke(); g.restore();
}

const R=D.rollouts, NH=D.horizons.length, N=R.length;
const COL=[{k:"b",cx:392,lab:"非特权信号",sub:"本体感受 ＋ 自身动作"},
           {k:"m",cx:888,lab:"＋ HB-MoE 内部状态",sub:"同一套折、同一读出器"}];
const CW=330, TOP=176, BOT=560;
const Y=z=>BOT-(cl(z,-3,3)+3)/6*(BOT-TOP);
/* deterministic horizontal offset so the cloud spreads without hiding overplot */
const JIT=R.map((_,i)=>{const s=Math.sin(i*12.9898)*43758.5453; return (s-Math.floor(s))-.5;});

/* continuous position between two recorded horizons */
function zAt(r,key,tf){
  const i=Math.min(NH-2,Math.floor(tf)), f=tf-i;
  return lp(r[key][i], r[key][i+1], ei(cl(f,0,1)));
}
function lerpArr(a,tf){
  const i=Math.min(NH-2,Math.floor(tf)), f=tf-i;
  return lp(a[i],a[i+1],ei(cl(f,0,1)));
}
function labelAt(tf){
  const i=Math.round(tf);
  return D.horizons[cl(i,0,NH-1)];
}

let showTrail=true;

function scene(tf,intro){
  // frame
  tx("同一批 rollout，同一个时刻，只换喂进去的特征",W/2,58,
     {size:15,col:K.dim,a:sg(intro,.1,.4)});
  const tNow=lerpArr(D.horizons,tf);
  tx("控制步 t"+tNow.toFixed(0),W/2,102,{size:34,col:K.ink,w:600,ls:1,a:sg(intro,0,.3)});

  for(let z=-3;z<=3;z+=1.5){
    ln(150,Y(z),W-150,Y(z),K.faint,1,.5);
    tx(z.toFixed(1),138,Y(z)+5,{size:12,col:K.dim,al:"right",a:.75});
  }
  // sits above the column titles: at TOP-26 it ran into the left column's subtitle
  tx("检测分数（组内标准化）",150,TOP-80,{size:13,col:K.dim,al:"left"});

  COL.forEach(c=>{
    const key=c.k;
    tx(c.lab,c.cx,TOP-52,{size:19,col:K.ink,w:600});
    tx(c.sub,c.cx,TOP-30,{size:13,col:K.dim});
    // trails: where each rollout came from
    if(showTrail && tf>0.03){
      const back=Math.max(0,tf-0.85);
      g.save(); g.globalAlpha=.16;
      R.forEach((r,i)=>{
        const x=c.cx+JIT[i]*CW;
        g.strokeStyle=r.s?K.trap:K.ok; g.lineWidth=1;
        g.beginPath(); g.moveTo(x,Y(zAt(r,key,back))); g.lineTo(x,Y(zAt(r,key,tf))); g.stroke();
      });
      g.restore();
    }
    R.forEach((r,i)=>{
      const x=c.cx+JIT[i]*CW, y=Y(zAt(r,key,tf));
      g.globalAlpha=.62;
      g.fillStyle=r.s?K.trap:K.ok;
      g.beginPath(); g.arc(x,y,2.6,0,7); g.fill();
    });
    g.globalAlpha=1;
    // class means
    [[1,K.trap],[0,K.ok]].forEach(([cls,col])=>{
      const v=R.filter(r=>r.s===cls).reduce((a,r)=>a+zAt(r,key,tf),0)/R.filter(r=>r.s===cls).length;
      ln(c.cx-CW/2-16,Y(v),c.cx+CW/2+16,Y(v),col,2.4,.95);
    });
    const gp=lerpArr(D.gap[key==="b"?"base":"moe"],tf);
    const au=lerpArr(D.auc[key==="b"?"base":"moe"],tf);
    tx("两组间距 "+gp.toFixed(2),c.cx,BOT+46,{size:16,col:K.dim});
    tx("AUC "+au.toFixed(3),c.cx,BOT+82,{size:30,col:key==="m"?K.hot:K.ink,w:600});
  });

  // running commentary keyed to the control step, not to wall clock
  const t=tNow;
  let msg="", col=K.dim;
  if(t<10)      msg="两团完全叠在一起 —— 陷入还没发生";
  else if(t<17) msg="仍然分不开";
  else if(t<24) msg="开始分层（陷入起点中位 t19）";
  else if(t<31) msg="明显分开了";
  else        { msg="右边分得更开：MoE 让检测更准"; col=K.hot; }
  tx(msg,W/2,BOT+126,{size:22,col,w:col===K.hot?600:400});
}

const DUR=26, HOLD=4;
let clock=2.2, playing=false, last=0;
function frame(){
  g.fillStyle=K.bg; g.fillRect(0,0,W,H);
  const prog=ei(cl(clock/(DUR-HOLD),0,1));
  scene(prog*(NH-1), cl(clock/1.6,0,1));
  document.getElementById("sc").value=Math.round(clock/DUR*1000);
  document.getElementById("tm").textContent=clock.toFixed(1)+"/"+DUR+"s";
  const li=Math.round(prog*(NH-1));
  document.querySelectorAll("#ch button").forEach((b,k)=>b.classList.toggle("on",k===li));
}
function loop(ts){
  if(playing){ if(last) clock=Math.min(DUR,clock+(ts-last)/1000); last=ts;
    if(clock>=DUR){playing=false;document.getElementById("p").textContent="▶";}
    frame(); } else last=0;
  requestAnimationFrame(loop);
}
document.getElementById("p").addEventListener("click",e=>{
  playing=!playing; if(clock>=DUR)clock=0; last=0; e.target.textContent=playing?"❚❚":"▶";});
document.getElementById("sc").addEventListener("input",e=>{
  playing=false; document.getElementById("p").textContent="▶";
  clock=e.target.value/1000*DUR; frame();});
document.getElementById("tr").addEventListener("click",e=>{
  showTrail=!showTrail; e.target.classList.toggle("on",showTrail); frame();});
document.getElementById("ch").innerHTML=D.horizons.map((h,i)=>
  `<button data-i="${i}">t${h}</button>`).join("");
document.querySelectorAll("#ch button").forEach(b=>b.addEventListener("click",()=>{
  playing=false; document.getElementById("p").textContent="▶";
  clock=(+b.dataset.i)/(NH-1)*(DUR-HOLD); frame();}));
frame(); requestAnimationFrame(loop);
</script>
