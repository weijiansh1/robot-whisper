  });
  const on=r.button[n]>1.2;
  tx("炉子 "+(on?"已开":"未开"),SCN.x+12,SCN.y+SCN.h-14,
     {size:12,col:on?K.hot:K.dim});
  tx("环圈＝抬离桌面的高度",SCN.x+SCN.w-12,SCN.y+SCN.h-14,{size:11,col:K.faint,al:"right"});
}

/* ---------- middle: MoE activation heat map ---------- */
function heat(r,t){
  panel(HM.x,HM.y,HM.w,HM.h,`HB L${D.layer} · action token ${D.token} 的 Top-4 选择`,
        "纵轴 32 位专家 · 每个控制步恰好 4 位被选中 · 金色＝连续 ≥4 步留任");
  const T=r.length, rh=HM.h/32, cw=HM.w/T;
  const n=Math.min(t,T-1);
  for(let e=0;e<32;e+=8) ln(HM.x,HM.y+e*rh,HM.x+HM.w,HM.y+e*rh,K.faint,1,.8);
  const runs=[];
  r.route.forEach((row,e)=>{let s=-1;
    for(let i=0;i<=T;i++){const on=i<T&&row[i]>0;
      if(on&&s<0)s=i;else if(!on&&s>=0){runs.push({e,s,t:i-1,len:i-s});s=-1;}}});
  runs.forEach(q=>{
    if(q.s>n)return;
    const y=HM.y+(q.e+.5)*rh, x1=HM.x+q.s*cw, x2=HM.x+Math.min(q.t,n)*cw+cw*.8;
    const st=q.len>=4;
    poly([[x1,y],[Math.max(x2,x1+1),y]],st?K.hot:(r.success?K.ok:K.trap),
         st?4.2:2.4,st?.95:.5);
  });
  ln(HM.x+n*cw,HM.y,HM.x+n*cw,HM.y+HM.h,K.ink,1,.45);
}

/* ---------- bottom: height traces ---------- */
function heights(r,t){
  panel(TR.x,TR.y,TR.w,TR.h,"物体与夹爪高度",
        "壶从未被抬起，就是这条 rollout 卡住的形态");
  const T=r.length, n=Math.min(t,T-1);
  const X=i=>TR.x+i/(T-1)*TR.w, Y=z=>TR.y+TR.h-(cl(z,Z0,Z1)-Z0)/(Z1-Z0)*TR.h;
  ln(TR.x,Y(0.966),TR.x+TR.w,Y(0.966),K.faint,1,1);
  tx("桌面 0.966",TR.x+6,Y(0.966)-6,{size:10.5,col:K.faint});
  [["pot1",K.pot1],["pot2",K.pot2],["eef",K.eef]].forEach(([k,c])=>{
    const pts=[];for(let i=0;i<=n;i++)pts.push([X(i),Y(r[k][i][2])]);
    poly(pts,c,2,k==="eef"?.5:.95);
    if(pts.length)disc(pts[pts.length-1][0],pts[pts.length-1][1],3.4,c,1,K.panel);});
  ln(X(n),TR.y,X(n),TR.y+TR.h,K.ink,1,.4);
  for(let i=0;i<T;i+=10) tx("t"+i,X(i),TR.y+TR.h+18,{size:11,col:K.dim,al:"center"});
}

function draw(){
  g.fillStyle=K.bg;g.fillRect(0,0,W,H);
  const r=RO[cur], T=r.length;
  const t=Math.round(prog*(T-1));
  tx(D.prompt||D.task,56,38,{size:14,col:K.dim});
  tx(`ep${r.episode}　${r.success?"成功":"停滞陷入"}　共 ${T} 个控制步`,56,66,
     {size:22,col:r.success?K.ok:K.trap,w:600});
  tx("控制步 t"+t,W-56,66,{size:22,col:K.ink,w:600,al:"right"});
  scene(r,t);heat(r,t);heights(r,t);
  if(cmp){
    const o=RO.find(q=>q.success!==r.success);
    if(o){const to=Math.min(t,o.length-1);
      g.save();g.globalAlpha=.42;
      const pts=[];for(let i=Math.max(0,to-14);i<=to;i++)pts.push([PX(o.pot1[i]),PY(o.pot1[i])]);
      poly(pts,o.success?K.ok:K.trap,2,.5);
      disc(PX(o.pot1[to]),PY(o.pot1[to]),6,o.success?K.ok:K.trap,.65,K.panel);
      g.restore();
      // top-right: at the top-left this sat straight on the 壶1/壶2/夹爪 legend
      tx(`对照 ep${o.episode}（${o.success?"成功":"陷入"}）的壶1`,SCN.x+SCN.w-12,SCN.y+16,
         {size:11,col:o.success?K.ok:K.trap,a:.8,al:"right"});}
  }
}

let prog=0, playing=false, last=0;
const SPD=1/9;                       // full rollout in ~9 s
function frame(){draw();
  document.getElementById("sc").value=Math.round(prog*1000);
  document.getElementById("tm").textContent=Math.round(prog*(RO[cur].length-1))+" / "+(RO[cur].length-1);}
function loop(ts){
  if(playing){if(last)prog=Math.min(1,prog+(ts-last)/1000*SPD);last=ts;
    if(prog>=1){playing=false;document.getElementById("p").textContent="▶";}
    frame();}else last=0;
  requestAnimationFrame(loop);}
document.getElementById("p").addEventListener("click",e=>{
  playing=!playing;if(prog>=1)prog=0;last=0;e.target.textContent=playing?"❚❚":"▶";});
document.getElementById("sc").addEventListener("input",e=>{
  playing=false;document.getElementById("p").textContent="▶";
  prog=e.target.value/1000;frame();});
document.getElementById("tl").addEventListener("click",e=>{
  trail=!trail;e.target.classList.toggle("on",trail);frame();});
document.getElementById("cmp").addEventListener("click",e=>{
  cmp=!cmp;e.target.classList.toggle("on",cmp);frame();});
function paintCases(){
  document.getElementById("cs").innerHTML='<span class="lab">选一条 rollout</span>'+
    RO.map((r,i)=>`<button data-i="${i}" class="${r.success?"ok":"trap"} ${i===cur?"on":""}">`+
      `ep${r.episode} ${r.success?"成功":"陷入"}</button>`).join("");
  document.querySelectorAll("#cs button[data-i]").forEach(b=>
    b.addEventListener("click",()=>{cur=+b.dataset.i;paintCases();frame();}));
}
document.getElementById("foot").innerHTML=
  `<b>左：</b>这批 capture 没有渲染帧，环境里也没有 MuJoCo，所以场景是用记录的 qpos 还原的俯视回放，`+
  `不是仿真视频。壶的位姿取自 <code>moka_pot_1/2_joint0</code>，夹爪取自客户端本体感受。`+
  `两个灶眼是全部成功轨迹终点的均值（经验估计，非场景真值，标准差约 1cm）。<br>`+
  `<b>中：</b>与左图同一时刻的权威 Top-4 专家选择。<b>右：</b>高度曲线——陷入的 rollout 里壶常常从未离开桌面。<br>`+
  `<b>选例方式：</b>成功/陷入各按壶的移动总距离取分位数抽 4 条，不是挑极端。`+
  `全量统计见 <a href="himoe-moe-case-spread.html">case-spread</a> ·`+
  ` <a href="himoe-moe-detect-cloud.html">detect-cloud</a>。`;
paintCases();frame();requestAnimationFrame(loop);
</script>
