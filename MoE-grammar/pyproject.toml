[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moe-routing-grammar"
version = "0.1.0"
description = "Grouped, leakage-resistant experiments for multitrack HiMoE routing grammar"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "torch>=2.5",
    "zarr>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
moe-grammar-extract = "moe_grammar.extract_features:main"
moe-grammar-run = "moe_grammar.run_experiments:main"
moe-grammar-dual-audit = "moe_grammar.run_dual_axis_audit:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["moe_grammar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
